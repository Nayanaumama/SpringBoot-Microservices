spring.application.name=UserService
spring.datasource.url=jdbc:postgresql://localhost:5432/Microservice-Project
spring.datasource.username=postgres
spring.datasource.password=Branchburg@26
server.port=8086
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#eureka.client.fetch-registry=true
#eureka.client.register-with-eureka=true
#eureka.instance.prefer-ip-address=true
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.config.import=optional:configserver:http://localhost:8090
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
resilience4j.circuitbreaker.instances.getUserCallingRateAndHotel.register-health-indicator=true
resilience4j.circuitbreaker.instances.getUserCallingRateAndHotel.sliding-window-size=10
resilience4j.circuitbreaker.instances.getUserCallingRateAndHotel.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.getUserCallingRateAndHotel.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.getUserCallingRateAndHotel.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.getUserCallingRateAndHotel.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.getUserCallingRateAndHotel.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.getUserCallingRateAndHotel.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.retry.instances.getUserCallingRateAndHotel.max-attempts=3
resilience4j.retry.instances.getUserCallingRateAndHotel.wait-duration=5s


